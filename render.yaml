services:
  - type: web
    name: guardian-account-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/serve_api.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GUARDIAN_CLOUD_MODE
        value: "true"
      - key: GUARDIAN_OSV_ENABLED
        value: "false"
      - key: GUARDIAN_AI_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GUARDIAN_DATABASE_URL
        sync: false
      - key: GUARDIAN_FRONTEND_URL
        sync: false
      - key: GUARDIAN_PUBLIC_API_URL
        sync: false
      - key: GUARDIAN_ALLOWED_ORIGINS
        sync: false
